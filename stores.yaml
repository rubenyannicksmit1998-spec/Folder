# Winkels + bronnen. Getest op 2026-10-06 met `python -m bot.fetch <url>`.
# status: ok = pagina laadt met prijzen | geblokkeerd = site blokkeert servers (403)
stores:
  - naam: Aldi
    bronnen: ["https://www.aldi.nl/aanbiedingen.html"]
  - naam: Jumbo
    bronnen: ["https://www.jumbo.com/aanbiedingen"]  # alleen de uitgelichte aanbiedingen
  - naam: Lidl
    bronnen: ["https://www.lidl.nl/aanbiedingen"]
  - naam: Action
    bronnen: ["https://www.action.com/nl-nl/"]
  - naam: Dirk
    bronnen: ["https://www.dirk.nl/aanbiedingen"]
  - naam: Plus
    bronnen: ["https://www.plus.nl/aanbiedingen"]
  # Geblokkeerd voor servers (403, bot-detectie). Werkt mogelijk vanaf een gewone computer
  # of via een folder-aggregator:
  - naam: Albert Heijn
    status: api  # via `python -m bot.ah` (onofficiële app-API), website is geblokkeerd
    bronnen: ["https://www.ah.nl/bonus"]
  - naam: Kruidvat
    status: lokaal  # blokkeert servers; draait op je eigen computer met `python -m bot.kruidvat_local`
    bronnen: ["https://www.kruidvat.nl/acties"]
    zoek_url: "https://www.kruidvat.nl/search?q={item}"  # ONGETEST: pas aan als de zoekpagina anders werkt
