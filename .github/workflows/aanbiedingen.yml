name: Aanbiedingen

on:
  schedule:
    - cron: "0 6 * * 1,4"  # maandag en donderdag, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m bot.main
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Prijsgeschiedenis opslaan
        run: |
          git config user.name "aanbiedingen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prijzen.sqlite
          git diff --cached --quiet || git commit -m "Update prijsgeschiedenis" && git push
